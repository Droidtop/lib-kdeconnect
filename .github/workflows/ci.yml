name: CI

# lib-kdeconnect's own checks, and its crates built for droidtop's two Android ABIs. Each program that uses
# it is built and tested against the commit here once it does (Droidtop/tracker#867 D2: "each repo's CI
# builds and tests every app that uses it"); droidtop-agent joins in slice 1's wiring
# (Droidtop/tracker#645). Work lands on main from ci/* branches once this is green.
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: success() || failure()
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - name: Test
        if: success() || failure()
        run: cargo test --workspace --no-fail-fast

  # droidtop links this through droidtop-agent's libdroidtop_agent.so: the crates must build for Android.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build for arm64-v8a and x86_64
        shell: bash
        run: |
          set -eu
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          for target in aarch64-linux-android x86_64-linux-android; do
            cargo build --release --workspace --target "$target"
          done

  # The oldest Rust every program builds the library with: Pythia's Debian packages use Ubuntu's rustc 1.85
  # (Pythia .github/workflows/build.yml). Cargo.lock holds dependency releases that build there.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.85"
      - name: Test on Rust 1.85
        run: cargo test --workspace --locked

  # Interop with an independent protocol 8 implementation (kcd, Go, MIT), pinned by commit:
  # link, pair with the same verification key on both sides, ping both ways, receive a shared file.
  # The official apps are checked on the rig (README, "Checking against the official apps").
  interop-kcd:
    runs-on: ubuntu-24.04
    env:
      KCD_COMMIT: 9cf876b74a4e59378b63024dc41998058d6b6580
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build kcd at its pinned commit
        # The runner's Go fetches the toolchain kcd's go.mod asks for (GOTOOLCHAIN=auto).
        run: GOBIN="$RUNNER_TEMP/bin" go install "github.com/bethropolis/kcd/cmd/kcd@$KCD_COMMIT"
      - name: Interop with kcd
        run: scripts/interop-kcd.sh "$RUNNER_TEMP/bin/kcd"

  # A green main whose version has no tag yet is released: CI tags v<version> on this commit, and that tag
  # is what programs and the other libraries pin (Droidtop/tracker#867 D2). To release, raise the version
  # in the root Cargo.toml (and the CHANGELOG) in the change that needs it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, android, interop-kcd, msrv]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag this version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ -n "$version" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          tag="v$version"
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            echo "released $tag at $GITHUB_SHA"
          fi
